# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: ASP.NET Core ActionFilters CI

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Install dependencies
      run: dotnet restore ./src/AspNetCore/Filters/Olumuyiwa.DotNetDevKit.AspNetCore.ActionFilters/Olumuyiwa.DotNetDevKit.AspNetCore.ActionFilters.csproj
      
    - name: Build
      run: dotnet build ./src/AspNetCore/Filters/Olumuyiwa.DotNetDevKit.AspNetCore.ActionFilters/Olumuyiwa.DotNetDevKit.AspNetCore.ActionFilters.csproj -c Release --no-restore
        
    - name: Generate NuGet package
      run: |
        dotnet pack ./src/AspNetCore/Filters/Olumuyiwa.DotNetDevKit.AspNetCore.ActionFilters/Olumuyiwa.DotNetDevKit.AspNetCore.ActionFilters.csproj -c Release -o out
        echo 'Contents of root directory:'
        ls -la
        echo 'Contents of out directory:'
        ls -la out/
        
    - name: Push generated package to NuGet
      run: dotnet nuget push "out/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
    
